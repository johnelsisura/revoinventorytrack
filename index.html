<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>PUP REVO 2026 — Sponsorship Inventory</title>
<script src="https://unpkg.com/react@18/umd/react.development.js"></script>
<script src="https://unpkg.com/react-dom@18/umd/react-dom.development.js"></script>
<script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<link rel="preconnect" href="https://fonts.googleapis.com"/>
<link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@300;400;500;600;700&family=Playfair+Display:wght@700&display=swap" rel="stylesheet"/>
<style>
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
:root{
  --maroon:#8B0000;--maroon-light:#a51a1a;--maroon-dark:#6b0000;--maroon-pale:#fdf0f0;
  --gold:#FFD700;--gold-dark:#c9a800;--gold-light:#fff3b0;
  --bg:#f8f6f4;--sidebar-bg:#1a0000;--card:#fff;
  --text:#1a1a1a;--text2:#555;--text3:#999;
  --border:#e8e0d8;--border2:#d4c8b8;
  --success:#2d7d46;--success-bg:#e8f5ed;
  --warn:#856404;--warn-bg:#fff8e1;
  --danger:#c0392b;--danger-bg:#fdecea;
  --radius:12px;--radius-sm:8px;
  font-family:'DM Sans',sans-serif;
}
body{background:var(--bg);color:var(--text);min-height:100vh}
input,select,textarea{font-family:inherit;font-size:14px}
button{font-family:inherit;cursor:pointer}
a{text-decoration:none;color:inherit}

/* Layout */
.app-shell{display:flex;min-height:100vh}
.sidebar{width:240px;background:var(--sidebar-bg);display:flex;flex-direction:column;position:fixed;top:0;left:0;height:100vh;z-index:100;transition:transform .3s}
.sidebar-logo{padding:24px 20px 16px;border-bottom:1px solid rgba(255,255,255,.08)}
.sidebar-logo h1{font-family:'Playfair Display',serif;color:var(--gold);font-size:18px;line-height:1.2}
.sidebar-logo p{color:rgba(255,255,255,.45);font-size:11px;margin-top:4px;letter-spacing:.5px;text-transform:uppercase}
.sidebar-nav{padding:12px 0;flex:1;overflow-y:auto}
.nav-item{display:flex;align-items:center;gap:12px;padding:11px 20px;color:rgba(255,255,255,.55);font-size:14px;font-weight:500;cursor:pointer;transition:all .2s;border-left:3px solid transparent}
.nav-item:hover{color:#fff;background:rgba(255,255,255,.06);border-left-color:rgba(255,255,255,.2)}
.nav-item.active{color:var(--gold);background:rgba(255,215,0,.08);border-left-color:var(--gold)}
.nav-icon{width:18px;height:18px;opacity:.8;flex-shrink:0}
.sidebar-footer{padding:16px 20px;border-top:1px solid rgba(255,255,255,.08)}
.live-badge{display:inline-flex;align-items:center;gap:6px;background:rgba(45,125,70,.25);border:1px solid rgba(45,125,70,.4);color:#4ade80;font-size:11px;font-weight:600;padding:4px 10px;border-radius:20px;letter-spacing:.3px}
.live-dot{width:6px;height:6px;background:#4ade80;border-radius:50%;animation:pulse 2s infinite}
@keyframes pulse{0%,100%{opacity:1}50%{opacity:.4}}

.main{margin-left:240px;flex:1;display:flex;flex-direction:column;min-height:100vh}
.topbar{background:#fff;border-bottom:1px solid var(--border);padding:0 28px;height:60px;display:flex;align-items:center;gap:16px;position:sticky;top:0;z-index:50}
.topbar-title{font-size:17px;font-weight:600;color:var(--text);flex:1}
.search-wrap{position:relative;width:320px}
.search-input{width:100%;padding:8px 14px 8px 36px;border:1.5px solid var(--border);border-radius:var(--radius-sm);font-size:13px;background:#f8f6f4;transition:all .2s;outline:none}
.search-input:focus{border-color:var(--maroon);background:#fff;box-shadow:0 0 0 3px rgba(139,0,0,.08)}
.search-icon{position:absolute;left:11px;top:50%;transform:translateY(-50%);color:var(--text3);pointer-events:none}
.search-results{position:absolute;top:calc(100% + 6px);left:0;right:0;background:#fff;border:1.5px solid var(--border);border-radius:var(--radius);box-shadow:0 8px 32px rgba(0,0,0,.12);z-index:200;max-height:360px;overflow-y:auto}
.search-section{padding:8px 0}
.search-section-title{padding:6px 14px;font-size:11px;font-weight:600;color:var(--text3);text-transform:uppercase;letter-spacing:.5px}
.search-item{padding:8px 14px;font-size:13px;cursor:pointer;display:flex;align-items:center;gap:8px;transition:background .15s}
.search-item:hover{background:var(--maroon-pale)}
.search-badge{font-size:10px;background:var(--maroon-pale);color:var(--maroon);padding:2px 6px;border-radius:10px;font-weight:600}

.page{padding:28px;flex:1}
.page-header{display:flex;align-items:center;justify-content:space-between;margin-bottom:24px;flex-wrap:wrap;gap:12px}
.page-title{font-size:22px;font-weight:700;color:var(--text)}
.page-subtitle{font-size:13px;color:var(--text3);margin-top:2px}

/* Cards */
.card{background:var(--card);border:1px solid var(--border);border-radius:var(--radius);padding:20px}
.stat-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(180px,1fr));gap:16px;margin-bottom:24px}
.stat-card{background:var(--card);border:1px solid var(--border);border-radius:var(--radius);padding:18px 20px;position:relative;overflow:hidden}
.stat-card::before{content:'';position:absolute;top:0;left:0;right:0;height:3px;background:var(--maroon)}
.stat-label{font-size:12px;color:var(--text3);font-weight:500;text-transform:uppercase;letter-spacing:.5px;margin-bottom:8px}
.stat-value{font-size:26px;font-weight:700;color:var(--text);line-height:1}
.stat-sub{font-size:12px;color:var(--text2);margin-top:6px}
.stat-icon{position:absolute;right:16px;top:50%;transform:translateY(-50%);width:36px;height:36px;background:var(--maroon-pale);border-radius:8px;display:flex;align-items:center;justify-content:center;color:var(--maroon)}

/* Buttons */
.btn{display:inline-flex;align-items:center;gap:6px;padding:9px 18px;border-radius:var(--radius-sm);font-size:14px;font-weight:600;border:none;transition:all .2s;cursor:pointer;white-space:nowrap}
.btn-primary{background:var(--maroon);color:#fff}
.btn-primary:hover{background:var(--maroon-light)}
.btn-gold{background:var(--gold);color:#1a0000}
.btn-gold:hover{background:var(--gold-dark)}
.btn-outline{background:#fff;color:var(--text);border:1.5px solid var(--border2)}
.btn-outline:hover{border-color:var(--maroon);color:var(--maroon)}
.btn-danger{background:var(--danger-bg);color:var(--danger);border:1px solid rgba(192,57,43,.2)}
.btn-danger:hover{background:var(--danger);color:#fff}
.btn-sm{padding:6px 12px;font-size:12px}
.btn-icon{padding:7px;border-radius:6px;background:transparent;border:1px solid var(--border);color:var(--text2)}
.btn-icon:hover{background:var(--maroon-pale);color:var(--maroon);border-color:var(--maroon)}

/* Table */
.table-wrap{overflow-x:auto;border-radius:var(--radius);border:1px solid var(--border)}
table{width:100%;border-collapse:collapse;font-size:13.5px}
thead{background:#faf7f3}
th{padding:11px 14px;text-align:left;font-weight:600;font-size:12px;color:var(--text2);text-transform:uppercase;letter-spacing:.4px;border-bottom:1px solid var(--border)}
td{padding:12px 14px;border-bottom:1px solid var(--border);vertical-align:middle}
tr:last-child td{border-bottom:none}
tbody tr:hover{background:#fdfaf8}
.group-row{background:#faf4e8;font-weight:600;color:var(--maroon)}
.total-row{background:#1a0000;color:#fff;font-weight:700}
.total-row td{border-bottom:none}

/* Status badges */
.badge{display:inline-flex;align-items:center;gap:4px;padding:3px 10px;border-radius:20px;font-size:12px;font-weight:600}
.badge-complete{background:var(--success-bg);color:var(--success)}
.badge-partial{background:var(--warn-bg);color:var(--warn)}
.badge-pending{background:var(--danger-bg);color:var(--danger)}
.badge-gold{background:#fff8e1;color:#856404}
.badge-silver{background:#f5f5f5;color:#555}
.badge-bronze{background:#fff3e0;color:#8B4513}
.badge-inkind{background:#f3e5f5;color:#6a1b9a}
.badge-dot{width:6px;height:6px;border-radius:50%;background:currentColor}

/* Progress bar */
.progress-wrap{margin-bottom:14px}
.progress-info{display:flex;justify-content:space-between;font-size:13px;margin-bottom:6px}
.progress-bar{height:8px;background:#f0ebe3;border-radius:4px;overflow:hidden}
.progress-fill{height:100%;border-radius:4px;background:linear-gradient(90deg,var(--maroon),var(--maroon-light));transition:width .6s ease}

/* Modal */
.modal-overlay{position:fixed;inset:0;background:rgba(0,0,0,.5);z-index:500;display:flex;align-items:center;justify-content:center;padding:20px;backdrop-filter:blur(2px)}
.modal{background:#fff;border-radius:16px;width:100%;max-width:560px;max-height:90vh;overflow-y:auto;box-shadow:0 24px 64px rgba(0,0,0,.2)}
.modal-header{padding:22px 24px 16px;border-bottom:1px solid var(--border);display:flex;align-items:center;justify-content:space-between;position:sticky;top:0;background:#fff;z-index:1}
.modal-title{font-size:18px;font-weight:700}
.modal-body{padding:20px 24px}
.modal-footer{padding:16px 24px;border-top:1px solid var(--border);display:flex;gap:10px;justify-content:flex-end;position:sticky;bottom:0;background:#fff}
.close-btn{width:32px;height:32px;border-radius:50%;background:var(--bg);border:none;display:flex;align-items:center;justify-content:center;cursor:pointer;color:var(--text2);font-size:18px;transition:all .2s}
.close-btn:hover{background:var(--maroon-pale);color:var(--maroon)}

/* Form */
.form-group{margin-bottom:16px}
.form-label{display:block;font-size:13px;font-weight:600;color:var(--text);margin-bottom:6px}
.form-label span{color:var(--danger)}
.form-input{width:100%;padding:9px 13px;border:1.5px solid var(--border);border-radius:var(--radius-sm);font-size:14px;outline:none;transition:all .2s;background:#fff}
.form-input:focus{border-color:var(--maroon);box-shadow:0 0 0 3px rgba(139,0,0,.08)}
.form-row{display:grid;grid-template-columns:1fr 1fr;gap:14px}
.form-hint{font-size:11px;color:var(--text3);margin-top:4px}

/* Toast */
.toast-wrap{position:fixed;bottom:24px;right:24px;z-index:1000;display:flex;flex-direction:column;gap:8px;max-width:360px}
.toast{background:#1a0000;color:#fff;padding:12px 18px;border-radius:10px;font-size:13.5px;font-weight:500;display:flex;align-items:center;gap:10px;box-shadow:0 8px 24px rgba(0,0,0,.25);animation:slideIn .3s ease;border-left:4px solid var(--gold)}
.toast.error{border-left-color:#f87171}
.toast.success{border-left-color:#4ade80}
@keyframes slideIn{from{transform:translateX(100%);opacity:0}to{transform:translateX(0);opacity:1}}

/* Skeleton */
.skeleton{background:linear-gradient(90deg,#f0ebe3 25%,#faf7f3 50%,#f0ebe3 75%);background-size:200% 100%;animation:shimmer 1.4s infinite;border-radius:6px}
@keyframes shimmer{0%{background-position:200% 0}100%{background-position:-200% 0}}

/* Feed */
.feed-item{display:flex;gap:14px;padding:14px 0;border-bottom:1px solid var(--border)}
.feed-item:last-child{border-bottom:none}
.feed-avatar{width:36px;height:36px;border-radius:50%;background:var(--maroon-pale);display:flex;align-items:center;justify-content:center;color:var(--maroon);font-size:13px;font-weight:700;flex-shrink:0}
.feed-content{flex:1;min-width:0}
.feed-title{font-size:13.5px;font-weight:500;line-height:1.4}
.feed-meta{font-size:12px;color:var(--text3);margin-top:3px}

/* Filters */
.filter-bar{display:flex;gap:10px;flex-wrap:wrap;margin-bottom:18px;align-items:center}
.filter-select{padding:7px 12px;border:1.5px solid var(--border);border-radius:var(--radius-sm);font-size:13px;outline:none;background:#fff;cursor:pointer}
.filter-select:focus{border-color:var(--maroon)}

/* Empty state */
.empty-state{text-align:center;padding:60px 20px;color:var(--text3)}
.empty-icon{font-size:48px;margin-bottom:12px;opacity:.4}
.empty-state h3{font-size:16px;font-weight:600;color:var(--text2);margin-bottom:6px}
.empty-state p{font-size:14px;margin-bottom:20px}

/* Mobile */
.menu-toggle{display:none;background:none;border:none;padding:6px;cursor:pointer;color:var(--text2)}
@media(max-width:768px){
  .sidebar{transform:translateX(-100%)}
  .sidebar.open{transform:translateX(0)}
  .main{margin-left:0}
  .menu-toggle{display:flex;align-items:center}
  .form-row{grid-template-columns:1fr}
  .stat-grid{grid-template-columns:repeat(2,1fr)}
  .page{padding:16px}
  .topbar{padding:0 16px}
  .search-wrap{width:200px}
  .sidebar-overlay{display:block!important}
}
.sidebar-overlay{display:none;position:fixed;inset:0;background:rgba(0,0,0,.4);z-index:99}

/* Login */
.login-page{min-height:100vh;display:flex;align-items:center;justify-content:center;background:var(--sidebar-bg);position:relative;overflow:hidden}
.login-bg{position:absolute;inset:0;background:radial-gradient(ellipse at 20% 50%,rgba(139,0,0,.4) 0%,transparent 60%),radial-gradient(ellipse at 80% 50%,rgba(255,215,0,.08) 0%,transparent 60%)}
.login-card{background:#fff;border-radius:20px;padding:40px;width:100%;max-width:420px;position:relative;z-index:1;box-shadow:0 32px 80px rgba(0,0,0,.4)}
.login-logo{text-align:center;margin-bottom:28px}
.login-logo h1{font-family:'Playfair Display',serif;font-size:26px;color:var(--maroon);margin-bottom:4px}
.login-logo p{font-size:13px;color:var(--text3)}
.login-tabs{display:flex;border-bottom:2px solid var(--border);margin-bottom:24px}
.login-tab{flex:1;padding:10px;text-align:center;font-size:14px;font-weight:600;color:var(--text3);cursor:pointer;border-bottom:2px solid transparent;margin-bottom:-2px;transition:all .2s}
.login-tab.active{color:var(--maroon);border-bottom-color:var(--maroon)}

/* Responsive tweaks */
.actions-col{display:flex;gap:6px;align-items:center}
.expandable{cursor:pointer}
.expand-content{padding:14px;background:#faf7f4;border-top:1px solid var(--border)}

.detail-grid{display:grid;grid-template-columns:1fr 1fr;gap:16px;margin-bottom:20px}
@media(max-width:600px){.detail-grid{grid-template-columns:1fr}}
.detail-item{background:#faf7f4;padding:14px;border-radius:var(--radius-sm)}
.detail-label{font-size:11px;text-transform:uppercase;letter-spacing:.4px;color:var(--text3);font-weight:600;margin-bottom:4px}
.detail-value{font-size:14px;font-weight:500;color:var(--text)}

.section-header{font-size:15px;font-weight:700;color:var(--text);margin:24px 0 12px;padding-bottom:8px;border-bottom:2px solid var(--border)}
</style>
</head>

const { useState, useEffect, useCallback, useRef } = React;

// ─── TOAST SYSTEM ───────────────────────────────────────────────────────────
let toastSetter = null;
function useToasts() {
  const [toasts, setToasts] = useState([]);
  toastSetter = setToasts;
  return toasts;
}
function toast(msg, type = 'success') {
  if (!toastSetter) return;
  const id = Date.now();
  toastSetter(p => [...p, { id, msg, type }]);
  setTimeout(() => toastSetter(p => p.filter(t => t.id !== id)), 3500);
}

// ─── ICONS ──────────────────────────────────────────────────────────────────
const Icon = ({ name, size = 18 }) => {

    dashboard: <svg width={size} height={size} viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><rect x="3" y="3" width="7" height="9"/><rect x="14" y="3" width="7" height="5"/><rect x="14" y="12" width="7" height="9"/><rect x="3" y="16" width="7" height="5"/></svg>,

    logout: <svg width={size} height={size} viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4"/><polyline points="16 17 21 12 16 7"/><line x1="21" y1="12" x2="9" y2="12"/></svg>,
    download: <svg width={size} height={size} viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/><polyline points="7 10 12 15 17 10"/><line x1="12" y1="15" x2="12" y2="3"/></svg>,
    eye: <svg width={size} height={size} viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"/><circle cx="12" cy="12" r="3"/></svg>,
    chevron: <svg width={size} height={size} viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><polyline points="9 18 15 12 9 6"/></svg>,
    menu: <svg width={size} height={size} viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round"><line x1="3" y1="6" x2="21" y2="6"/><line x1="3" y1="12" x2="21" y2="12"/><line x1="3" y1="18" x2="21" y2="18"/></svg>,
    print: <svg width={size} height={size} viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><polyline points="6 9 6 2 18 2 18 9"/><path d="M6 18H4a2 2 0 0 1-2-2v-5a2 2 0 0 1 2-2h16a2 2 0 0 1 2 2v5a2 2 0 0 1-2 2h-2"/><rect x="6" y="14" width="12" height="8"/></svg>,

  return icons[name] || null;
};

// ─── UTILS ──────────────────────────────────────────────────────────────────
const fmtDate = d => d ? new Date(d).toLocaleDateString('en-PH', { year:'numeric', month:'short', day:'numeric' }) : '—';
const fmtDateTime = d => d ? new Date(d).toLocaleString('en-PH', { month:'short', day:'numeric', hour:'2-digit', minute:'2-digit' }) : '—';
const initials = name => name ? name.split(' ').map(w=>w[0]).join('').toUpperCase().slice(0,2) : '??';
const tierBadge = tier => {
  const map = { Gold:'badge-gold', Silver:'badge-silver', Bronze:'badge-bronze', 'In-Kind':'badge-inkind' };
  return <span className={`badge ${map[tier]||'badge-silver'}`}>{tier}</span>;
};
const statusBadge = (cur, total) => {
  if (!total) return <span className="badge badge-pending"><span className="badge-dot"/>Pending</span>;
  if (cur >= total) return <span className="badge badge-complete"><span className="badge-dot"/>Complete</span>;
  if (cur > 0) return <span className="badge badge-partial"><span className="badge-dot"/>Partial</span>;
  return <span className="badge badge-pending"><span className="badge-dot"/>Pending</span>;
};

function exportCSV(transactions, sponsors, items) {
  const rows = [['Date','Sponsor','Item','Variant','Qty Received','Received By','Notes']];
  transactions.forEach(t => {
    const sp = sponsors.find(s=>s.id===t.sponsor_id);
    const it = items.find(i=>i.id===t.item_id);
    rows.push([fmtDate(t.date_received), sp?.name||'', it?.name||'', it?.variant||'', t.qty_received, t.received_by, t.notes||'']);
  });
  const csv = rows.map(r => r.map(c => `"${String(c).replace(/"/g,'""')}"`).join(',')).join('\n');
  const a = document.createElement('a');
  a.href = 'data:text/csv;charset=utf-8,' + encodeURIComponent(csv);
  a.download = `revo2026-transactions-${new Date().toISOString().slice(0,10)}.csv`;
  a.click();
}

// ─── LOGIN PAGE ──────────────────────────────────────────────────────────────
function LoginPage({ onLogin }) {
  const [tab, setTab] = useState('login');
  const [email, setEmail] = useState('');
  const [password, setPassword] = useState('');
  const [name, setName] = useState('');
  const [loading, setLoading] = useState(false);
  const [err, setErr] = useState('');

  async function handleSubmit(e) {
    e.preventDefault();
    setLoading(true); setErr('');
    try {
      if (tab === 'login') {
        const { data, error } = await sb.auth.signInWithPassword({ email, password });
        if (error) throw error;
        onLogin(data.user);
      } else {
        const { data, error } = await sb.auth.signUp({ email, password, options: { data: { full_name: name } } });
        if (error) throw error;
        if (data.user?.identities?.length === 0) { setErr('Email already registered. Please sign in.'); setLoading(false); return; }
        setErr(''); toast('Account created! You can now sign in.', 'success');
        setTab('login');
      }
    } catch(e) { setErr(e.message); }
    setLoading(false);
  }

  return (
    <div className="login-page">
      <div className="login-bg"/>
      <div className="login-card">
        <div className="login-logo">
          <h1>PUP REVO 2026</h1>
          <p>Sponsorship Items Inventory System</p>
        </div>
        <div className="login-tabs">
          <div className={`login-tab ${tab==='login'?'active':''}`} onClick={()=>setTab('login')}>Sign In</div>
          <div className={`login-tab ${tab==='signup'?'active':''}`} onClick={()=>setTab('signup')}>Sign Up</div>
        </div>
        <form onSubmit={handleSubmit}>
          {tab==='signup' && (
            <div className="form-group">
              <label className="form-label">Full Name <span>*</span></label>
              <input className="form-input" value={name} onChange={e=>setName(e.target.value)} placeholder="Your full name" required/>
            </div>
          )}
          <div className="form-group">
            <label className="form-label">Email <span>*</span></label>
            <input className="form-input" type="email" value={email} onChange={e=>setEmail(e.target.value)} placeholder="your@email.com" required/>
          </div>
          <div className="form-group">
            <label className="form-label">Password <span>*</span></label>
            <input className="form-input" type="password" value={password} onChange={e=>setPassword(e.target.value)} placeholder="••••••••" required minLength={6}/>
          </div>
          {err && <div style={{background:'var(--danger-bg)',color:'var(--danger)',padding:'10px 14px',borderRadius:8,fontSize:13,marginBottom:14}}>{err}</div>}
          <button className="btn btn-primary" type="submit" disabled={loading} style={{width:'100%',justifyContent:'center',padding:'11px'}}>
            {loading ? 'Please wait…' : tab==='login' ? 'Sign In' : 'Create Account'}
          </button>
        </form>
      </div>
    </div>
  );
}

// ─── TRANSACTION MODAL ────────────────────────────────────────────────────────
function TransactionModal({ open, onClose, onSaved, initial, sponsors, items, defaultSponsorId }) {
  const blank = { date_received: new Date().toISOString().slice(0,10), sponsor_id:'', item_id:'', qty_received:'', received_by:'', notes:'' };
  const [form, setForm] = useState(blank);
  const [loading, setLoading] = useState(false);
  useEffect(() => {
    if (open) {
      if (initial) {
        setForm({ date_received: initial.date_received?.slice(0,10)||blank.date_received, sponsor_id:initial.sponsor_id||'', item_id:initial.item_id||'', qty_received:initial.qty_received||'', received_by:initial.received_by||'', notes:initial.notes||'' });
      } else {
        setForm({ ...blank, sponsor_id: defaultSponsorId||'' });
      }
    }
  }, [open]);
  const set = k => e => setForm(p => ({ ...p, [k]: e.target.value, ...(k==='sponsor_id'?{item_id:''}:{}) }));
  const filteredItems = form.sponsor_id ? items.filter(i=>i.sponsor_id===form.sponsor_id) : items;
  async function save() {
    if (!form.item_id || !form.qty_received || !form.received_by) { toast('Item, Qty, and Received By are required','error'); return; }
    setLoading(true);
    try {
      const payload = { date_received:form.date_received, sponsor_id:form.sponsor_id||null, item_id:form.item_id, qty_received:parseInt(form.qty_received), received_by:form.received_by, notes:form.notes };
      if (initial?.id) {
        const { error } = await sb.from('transactions').update(payload).eq('id',initial.id);
        if (error) throw error;
      } else {
        const { error } = await sb.from('transactions').insert([payload]);
        if (error) throw error;
      }
      // Update current_qty
      const { data: txns } = await sb.from('transactions').select('qty_received').eq('item_id', form.item_id);
      const total = txns?.reduce((a,t)=>a+t.qty_received,0)||0;
      await sb.from('items').update({ current_qty: total }).eq('id', form.item_id);
      toast(initial?.id ? 'Transaction updated!' : 'Transaction logged!');
      onSaved(); onClose();
    } catch(e) { toast(e.message,'error'); }
    setLoading(false);
  }
  if (!open) return null;
  return (
    <div className="modal-overlay" onClick={onClose}>
      <div className="modal" onClick={e=>e.stopPropagation()}>
        <div className="modal-header">
          <span className="modal-title">{initial?.id ? 'Edit Transaction' : 'Log Transaction'}</span>
          <button className="close-btn" onClick={onClose}><Icon name="x" size={14}/></button>
        </div>
        <div className="modal-body">
          <div className="form-row">
            <div className="form-group"><label className="form-label">Date Received <span>*</span></label><input className="form-input" type="date" value={form.date_received} onChange={set('date_received')}/></div>
            <div className="form-group"><label className="form-label">Sponsor</label>
              <select className="form-input" value={form.sponsor_id} onChange={set('sponsor_id')}>
                <option value="">— All / No sponsor —</option>
                {sponsors.map(s=><option key={s.id} value={s.id}>{s.name}</option>)}
              </select>
            </div>
          </div>
          <div className="form-group"><label className="form-label">Item <span>*</span></label>
            <select className="form-input" value={form.item_id} onChange={set('item_id')}>
              <option value="">— Select item —</option>
              {filteredItems.map(i=><option key={i.id} value={i.id}>{i.name}{i.variant?` – ${i.variant}`:''}</option>)}
            </select>
            {form.sponsor_id && <p className="form-hint">Showing items for selected sponsor only.</p>}
          </div>
          <div className="form-row">
            <div className="form-group"><label className="form-label">Qty Received <span>*</span></label><input className="form-input" type="number" min="1" value={form.qty_received} onChange={set('qty_received')} placeholder="0"/></div>
            <div className="form-group"><label className="form-label">Received By <span>*</span></label><input className="form-input" value={form.received_by} onChange={set('received_by')} placeholder="Team member name"/></div>
          </div>
          <div className="form-group"><label className="form-label">Notes</label><textarea className="form-input" value={form.notes} onChange={set('notes')} rows={2} placeholder="Optional notes…" style={{resize:'vertical'}}/></div>
        </div>
        <div className="modal-footer">
          <button className="btn btn-outline" onClick={onClose}>Cancel</button>
          <button className="btn btn-primary" onClick={save} disabled={loading}>{loading?'Saving…':'Save Transaction'}</button>
        </div>
      </div>
    </div>
  );
}

      <div className="detail-grid">
        <div className="detail-item"><div className="detail-label">Contact Person</div><div className="detail-value">{sponsor.contact_person||'—'}</div></div>
        <div className="detail-item"><div className="detail-label">Contact Number</div><div className="detail-value">{sponsor.contact_number||'—'}</div></div>
        <div className="detail-item"><div className="detail-label">Email</div><div className="detail-value">{sponsor.email||'—'}</div></div>
        <div className="detail-item"><div className="detail-label">Tier</div><div className="detail-value">{tierBadge(sponsor.tier)}</div></div>
      </div>
      {sponsor.notes && <div className="card" style={{marginBottom:20}}><div className="detail-label" style={{marginBottom:6}}>Notes</div><p style={{fontSize:14,color:'var(--text2)',lineHeight:1.6}}>{sponsor.notes}</p></div>}

      <div className="card" style={{marginBottom:20}}>
        <div style={{fontWeight:700,fontSize:15,marginBottom:8}}>Fulfillment Summary</div>
        <div style={{display:'flex',justifyContent:'space-between',fontSize:13,marginBottom:8}}>
          <span>Received: <strong>{rec}</strong></span><span>Expected: <strong>{exp}</strong></span><span>Progress: <strong>{pct}%</strong></span>
        </div>
        <div className="progress-bar" style={{height:12}}><div className="progress-fill" style={{width:`${pct}%`}}/></div>
      </div>

      <div className="section-header">Items ({spItems.length})</div>
      <div className="table-wrap" style={{marginBottom:20}}>
        {spItems.length===0 ? <div className="empty-state" style={{padding:30}}><p>No items linked to this sponsor.</p></div> : (
          <table><thead><tr><th>Item</th><th>Variant</th><th>Category</th><th>Total Qty</th><th>Received</th><th>Status</th></tr></thead>
          <tbody>{spItems.map(i=>(
            <tr key={i.id}><td>{i.name}</td><td>{i.variant||'—'}</td><td>{i.category||'—'}</td><td>{i.total_qty}</td><td>{i.current_qty||0}</td><td>{statusBadge(i.current_qty||0,i.total_qty)}</td></tr>
          ))}</tbody></table>
        )}
      </div>

      <div style={{display:'flex',alignItems:'center',justifyContent:'space-between',marginBottom:12}}>
        <div className="section-header" style={{margin:0}}>Transactions ({spTx.length})</div>
        <button className="btn btn-primary btn-sm" onClick={()=>onLogTx(sponsorId)}><Icon name="plus" size={14}/>Log Transaction</button>
      </div>
      <div className="table-wrap">
        {spTx.length===0 ? <div className="empty-state" style={{padding:30}}><p>No transactions yet.</p></div> : (
          <table><thead><tr><th>Date</th><th>Item</th><th>Qty</th><th>Received By</th><th>Notes</th></tr></thead>
          <tbody>{[...spTx].sort((a,b)=>new Date(b.date_received)-new Date(a.date_received)).map(t=>{
            const it = items.find(i=>i.id===t.item_id);
            return <tr key={t.id}><td>{fmtDate(t.date_received)}</td><td>{it?.name||'—'}{it?.variant?` (${it.variant})`:''}</td><td>{t.qty_received}</td><td>{t.received_by}</td><td style={{color:'var(--text3)'}}>{t.notes||'—'}</td></tr>;
          })}</tbody></table>
        )}
      </div>
    </div>
  );
}

// ─── SPONSORS PAGE ────────────────────────────────────────────────────────────
function SponsorsPage({ sponsors, items, transactions, onRefresh }) {
  const [modalOpen, setModalOpen] = useState(false);
  const [editSponsor, setEditSponsor] = useState(null);
  const [delSponsor, setDelSponsor] = useState(null);
  const [detailId, setDetailId] = useState(null);
  const [txModal, setTxModal] = useState(false);
  const [txDefaultSponsor, setTxDefaultSponsor] = useState('');

  if (detailId) return <SponsorDetail sponsorId={detailId} sponsors={sponsors} items={items} transactions={transactions} onBack={()=>setDetailId(null)} onRefresh={onRefresh} onLogTx={sid=>{setTxDefaultSponsor(sid);setTxModal(true);}}/>;

  async function doDelete() {
    const { error } = await sb.from('sponsors').delete().eq('id',delSponsor.id);
    if (error) { toast(error.message,'error'); } else { toast('Sponsor deleted'); onRefresh(); }
    setDelSponsor(null);
  }

  return (
    <div className="page">
      <SponsorModal open={modalOpen||!!editSponsor} onClose={()=>{setModalOpen(false);setEditSponsor(null);}} onSaved={onRefresh} initial={editSponsor}/>
      <ConfirmModal open={!!delSponsor} title="Delete Sponsor" msg={`Delete "${delSponsor?.name}"? All linked items and transactions will lose their sponsor reference.`} onConfirm={doDelete} onClose={()=>setDelSponsor(null)}/>

      <div className="page-header">
        <div><div className="page-title">Sponsors</div><div className="page-subtitle">{sponsors.length} sponsor{sponsors.length!==1?'s':''} registered</div></div>
        <button className="btn btn-primary" onClick={()=>setModalOpen(true)}><Icon name="plus" size={16}/>Add Sponsor</button>
      </div>
      {sponsors.length===0 ? (
        <div className="empty-state"><div className="empty-icon">🤝</div><h3>No sponsors yet</h3><p>Start by adding your first sponsor.</p><button className="btn btn-primary" onClick={()=>setModalOpen(true)}><Icon name="plus" size={16}/>Add Sponsor</button></div>
      ) : (
        <div className="table-wrap">
          <table>
            <thead><tr><th>Name</th><th>Company</th><th>Contact</th><th>Tier</th><th>Items</th><th>Progress</th><th>Actions</th></tr></thead>

              const exp = spItems.reduce((a,i)=>a+(i.total_qty||0),0);
              const rec = spItems.reduce((a,i)=>a+(i.current_qty||0),0);
              const pct = exp ? Math.round(rec/exp*100) : 0;
              return (
                <tr key={sp.id} className="expandable" onClick={()=>setDetailId(sp.id)}>
                  <td><strong>{sp.name}</strong></td>
                  <td style={{color:'var(--text2)'}}>{sp.company||'—'}</td>
                  <td style={{fontSize:12,color:'var(--text2)'}}>{sp.contact_person}{sp.contact_number?<><br/>{sp.contact_number}</>:''}</td>
                  <td>{tierBadge(sp.tier)}</td>
                  <td>{spItems.length}</td>
                  <td style={{minWidth:130}}>
                    <div style={{fontSize:11,color:'var(--text3)',marginBottom:4}}>{rec}/{exp} ({pct}%)</div>
                    <div className="progress-bar" style={{height:6}}><div className="progress-fill" style={{width:`${pct}%`}}/></div>
                  </td>
                  <td onClick={e=>e.stopPropagation()}>
                    <div className="actions-col">
                      <button className="btn-icon" title="View" onClick={()=>setDetailId(sp.id)}><Icon name="eye" size={14}/></button>
                      <button className="btn-icon" title="Edit" onClick={()=>setEditSponsor(sp)}><Icon name="edit" size={14}/></button>
                      <button className="btn-icon" title="Delete" style={{color:'var(--danger)'}} onClick={()=>setDelSponsor(sp)}><Icon name="trash" size={14}/></button>
                    </div>
                  </td>
                </tr>
              );
            })}</tbody>
          </table>
        </div>
      )}
    </div>
  );
}

// ─── ITEMS PAGE ───────────────────────────────────────────────────────────────
function ItemsPage({ items, sponsors, onRefresh }) {
  const [modalOpen, setModalOpen] = useState(false);
  const [editItem, setEditItem] = useState(null);
  const [delItem, setDelItem] = useState(null);

  async function doDelete() {
    const { error } = await sb.from('items').delete().eq('id',delItem.id);
    if (error) { toast(error.message,'error'); } else { toast('Item deleted'); onRefresh(); }
    setDelItem(null);
  }

  const grouped = items.reduce((acc,i)=>{
    const cat = i.category||'Uncategorized';
    if (!acc[cat]) acc[cat]=[];
    acc[cat].push(i);
    return acc;
  },{});
  const grandTotal = { total_qty: items.reduce((a,i)=>a+(i.total_qty||0),0), current_qty: items.reduce((a,i)=>a+(i.current_qty||0),0) };

  return (
    <div className="page">
      <ItemModal open={modalOpen||!!editItem} onClose={()=>{setModalOpen(false);setEditItem(null);}} onSaved={onRefresh} initial={editItem} sponsors={sponsors}/>
      <ConfirmModal open={!!delItem} title="Delete Item" msg={`Delete "${delItem?.name}"? All transactions for this item will lose their item reference.`} onConfirm={doDelete} onClose={()=>setDelItem(null)}/>
      <div className="page-header">
        <div><div className="page-title">Items</div><div className="page-subtitle">{items.length} item{items.length!==1?'s':''} tracked</div></div>
        <div style={{display:'flex',gap:8'}}>
          <button className="btn btn-outline btn-sm" onClick={()=>window.print()}><Icon name="print" size={14}/>Print</button>
          <button className="btn btn-primary" onClick={()=>setModalOpen(true)}><Icon name="plus" size={16}/>Add Item</button>
        </div>
      </div>
      {items.length===0 ? (
        <div className="empty-state"><div className="empty-icon">📦</div><h3>No items yet</h3><p>Add your first sponsorship item to get started.</p><button className="btn btn-primary" onClick={()=>setModalOpen(true)}><Icon name="plus" size={16}/>Add Item</button></div>
      ) : (
        <div className="table-wrap">
          <table>
            <thead><tr><th>Item</th><th>Variant</th><th>Sponsor</th><th>Category</th><th>Total Qty</th><th>Received</th><th>Status</th><th>Actions</th></tr></thead>
            <tbody>
              {Object.entries(grouped).map(([cat,catItems])=>{
                const catExp = catItems.reduce((a,i)=>a+(i.total_qty||0),0);
                const catRec = catItems.reduce((a,i)=>a+(i.current_qty||0),0);
                return [
                  <tr key={`cat-${cat}`} className="group-row"><td colSpan={4}>{cat}</td><td>{catExp}</td><td>{catRec}</td><td colSpan={2}/></tr>,
                  ...catItems.map(it=>{
                    const sp = sponsors.find(s=>s.id===it.sponsor_id);
                    return (
                      <tr key={it.id}>
                        <td><strong>{it.name}</strong></td>
                        <td style={{color:'var(--text2)'}}>{it.variant||'—'}</td>
                        <td style={{fontSize:13}}>{sp?.name||<span style={{color:'var(--text3)'}}>—</span>}</td>
                        <td style={{color:'var(--text3)',fontSize:12}}>{it.category||'—'}</td>
                        <td>{it.total_qty}</td>
                        <td><strong>{it.current_qty||0}</strong></td>
                        <td>{statusBadge(it.current_qty||0,it.total_qty)}</td>
                        <td><div className="actions-col">
                          <button className="btn-icon" title="Edit" onClick={()=>setEditItem(it)}><Icon name="edit" size={14}/></button>
                          <button className="btn-icon" title="Delete" style={{color:'var(--danger)'}} onClick={()=>setDelItem(it)}><Icon name="trash" size={14}/></button>
                        </div></td>
                      </tr>
                    );
                  })
                ];
              })}
              <tr className="total-row"><td colSpan={4} style={{color:'var(--gold)'}}>GRAND TOTAL</td><td>{grandTotal.total_qty}</td><td>{grandTotal.current_qty}</td><td>{statusBadge(grandTotal.current_qty,grandTotal.total_qty)}</td><td/></tr>
            </tbody>
          </table>
        </div>
      )}
    </div>
  );
}

// ─── TRANSACTIONS PAGE ────────────────────────────────────────────────────────
function TransactionsPage({ transactions, sponsors, items, onRefresh }) {
  const [modalOpen, setModalOpen] = useState(false);
  const [editTx, setEditTx] = useState(null);
  const [delTx, setDelTx] = useState(null);
  const [filterSponsor, setFilterSponsor] = useState('');
  const [filterItem, setFilterItem] = useState('');
  const [filterBy, setFilterBy] = useState('');
  const [filterFrom, setFilterFrom] = useState('');
  const [filterTo, setFilterTo] = useState('');
  const [expandedId, setExpandedId] = useState(null);

  async function doDelete() {
    const { error } = await sb.from('transactions').delete().eq('id',delTx.id);
    if (error) { toast(error.message,'error'); return; }
    // Recalc current_qty
    const { data: txns } = await sb.from('transactions').select('qty_received').eq('item_id',delTx.item_id);
    const total = txns?.reduce((a,t)=>a+t.qty_received,0)||0;
    await sb.from('items').update({current_qty:total}).eq('id',delTx.item_id);
    toast('Transaction deleted'); onRefresh(); setDelTx(null);
  }

  const filtered = transactions
    .filter(t=>!filterSponsor||t.sponsor_id===filterSponsor)
    .filter(t=>!filterItem||t.item_id===filterItem)
    .filter(t=>!filterBy||t.received_by?.toLowerCase().includes(filterBy.toLowerCase()))
    .filter(t=>!filterFrom||t.date_received>=filterFrom)
    .filter(t=>!filterTo||t.date_received<=filterTo)
    .sort((a,b)=>new Date(b.date_received)-new Date(a.date_received));

  return (
    <div className="page">
      <TransactionModal open={modalOpen||!!editTx} onClose={()=>{setModalOpen(false);setEditTx(null);}} onSaved={onRefresh} initial={editTx} sponsors={sponsors} items={items}/>
      <ConfirmModal open={!!delTx} title="Delete Transaction" msg="Delete this transaction? Item quantities will be recalculated." onConfirm={doDelete} onClose={()=>setDelTx(null)}/>
      <div className="page-header">
        <div><div className="page-title">Transactions</div><div className="page-subtitle">{filtered.length} of {transactions.length} records</div></div>
        <div style={{display:'flex',gap:8}}>
          <button className="btn btn-outline btn-sm" onClick={()=>exportCSV(transactions,sponsors,items)}><Icon name="download" size={14}/>Export CSV</button>
          <button className="btn btn-primary" onClick={()=>setModalOpen(true)}><Icon name="plus" size={16}/>Log Transaction</button>
        </div>
      </div>

      <div className="filter-bar">
        <select className="filter-select" value={filterSponsor} onChange={e=>setFilterSponsor(e.target.value)}>
          <option value="">All Sponsors</option>{sponsors.map(s=><option key={s.id} value={s.id}>{s.name}</option>)}
        </select>
        <select className="filter-select" value={filterItem} onChange={e=>setFilterItem(e.target.value)}>
          <option value="">All Items</option>{items.map(i=><option key={i.id} value={i.id}>{i.name}{i.variant?` (${i.variant})`:''}</option>)}
        </select>
        <input className="filter-select" placeholder="Received by…" value={filterBy} onChange={e=>setFilterBy(e.target.value)} style={{minWidth:140}}/>
        <input type="date" className="filter-select" value={filterFrom} onChange={e=>setFilterFrom(e.target.value)}/>
        <span style={{fontSize:12,color:'var(--text3)'}}>to</span>
        <input type="date" className="filter-select" value={filterTo} onChange={e=>setFilterTo(e.target.value)}/>
        {(filterSponsor||filterItem||filterBy||filterFrom||filterTo) && <button className="btn btn-outline btn-sm" onClick={()=>{setFilterSponsor('');setFilterItem('');setFilterBy('');setFilterFrom('');setFilterTo('');}}>Clear</button>}
      </div>

      {filtered.length===0 ? (
        <div className="empty-state"><div className="empty-icon">📋</div><h3>No transactions found</h3><p>Try adjusting your filters or log a new transaction.</p></div>
      ) : (
        <div className="table-wrap">
          <table>
            <thead><tr><th>Date</th><th>Sponsor</th><th>Item</th><th>Qty</th><th>Received By</th><th>Notes</th><th>Actions</th></tr></thead>
            <tbody>{filtered.map(t=>{
              const sp = sponsors.find(s=>s.id===t.sponsor_id);
              const it = items.find(i=>i.id===t.item_id);
              return (
                <tr key={t.id} className="expandable" onClick={()=>setExpandedId(expandedId===t.id?null:t.id)}>
                  <td style={{fontSize:12,color:'var(--text2)'}}>{fmtDate(t.date_received)}</td>
                  <td><strong>{sp?.name||<span style={{color:'var(--text3)'}}>—</span>}</strong></td>
                  <td>{it?.name||'—'}{it?.variant?<><br/><span style={{fontSize:11,color:'var(--text3)'}}>{it.variant}</span></>:''}</td>
                  <td><strong>{t.qty_received}</strong></td>
                  <td>{t.received_by}</td>
                  <td style={{color:'var(--text3)',fontSize:12,maxWidth:150,overflow:'hidden',textOverflow:'ellipsis',whiteSpace:'nowrap'}}>{t.notes||'—'}</td>
                  <td onClick={e=>e.stopPropagation()}>
                    <div className="actions-col">
                      <button className="btn-icon" title="Edit" onClick={()=>setEditTx(t)}><Icon name="edit" size={14}/></button>
                      <button className="btn-icon" title="Delete" style={{color:'var(--danger)'}} onClick={()=>setDelTx(t)}><Icon name="trash" size={14}/></button>
                    </div>
                  </td>
                </tr>
              );
            })}</tbody>
          </table>
        </div>
      )}
    </div>
  );
}

// ─── MAIN APP ─────────────────────────────────────────────────────────────────
function App() {
  const [user, setUser] = useState(null);
  const [authLoading, setAuthLoading] = useState(true);
  const [page, setPage] = useState('dashboard');
  const [sponsors, setSponsors] = useState([]);
  const [items, setItems] = useState([]);
  const [transactions, setTransactions] = useState([]);
  const [loading, setLoading] = useState(true);
  const [liveConnected, setLiveConnected] = useState(false);
  const [sidebarOpen, setSidebarOpen] = useState(false);
  const [searchQ, setSearchQ] = useState('');
  const [showSearch, setShowSearch] = useState(false);
  const searchRef = useRef();
  const toasts = useToasts();

  // Auth check
  useEffect(() => {
    sb.auth.getSession().then(({data:{session}})=>{
      setUser(session?.user||null);
      setAuthLoading(false);
    });
    const { data:{subscription} } = sb.auth.onAuthStateChange((_,session)=>{
      setUser(session?.user||null);
    });
    return ()=>subscription.unsubscribe();
  }, []);

  async function fetchAll() {
    setLoading(true);
    const [sp,it,tx] = await Promise.all([
      sb.from('sponsors').select('*').order('created_at',{ascending:false}),
      sb.from('items').select('*').order('created_at',{ascending:false}),
      sb.from('transactions').select('*').order('date_received',{ascending:false}),
    ]);
    setSponsors(sp.data||[]);
    setItems(it.data||[]);
    setTransactions(tx.data||[]);
    setLoading(false);
  }

  useEffect(()=>{
    if (!user) return;
    fetchAll();
    // Realtime
    const ch = sb.channel('revo2026-realtime')
      .on('postgres_changes',{event:'*',schema:'public',table:'sponsors'},()=>fetchAll())
      .on('postgres_changes',{event:'*',schema:'public',table:'items'},()=>fetchAll())
      .on('postgres_changes',{event:'*',schema:'public',table:'transactions'},()=>fetchAll())
      .subscribe(status=>{ setLiveConnected(status==='SUBSCRIBED'); });
    return ()=>sb.removeChannel(ch);
  },[user]);

  // Close search on outside click
  useEffect(()=>{
    function h(e){ if(searchRef.current&&!searchRef.current.contains(e.target)) setShowSearch(false); }
    document.addEventListener('mousedown',h);
    return ()=>document.removeEventListener('mousedown',h);
  },[]);

  async function handleLogout() {
    await sb.auth.signOut();
    toast('Signed out successfully','success');
  }

  if (authLoading) return <div style={{display:'flex',alignItems:'center',justifyContent:'center',height:'100vh',fontSize:16,color:'var(--text3)'}}>Loading…</div>;
  if (!user) return <LoginPage onLogin={u=>setUser(u)}/>;

  // Search
  const q = searchQ.toLowerCase();
  const srSponsors = q.length>1 ? sponsors.filter(s=>s.name.toLowerCase().includes(q)||s.company?.toLowerCase().includes(q)) : [];
  const srItems = q.length>1 ? items.filter(i=>i.name.toLowerCase().includes(q)||i.variant?.toLowerCase().includes(q)||i.category?.toLowerCase().includes(q)) : [];
  const srTx = q.length>1 ? transactions.filter(t=>t.received_by?.toLowerCase().includes(q)||t.notes?.toLowerCase().includes(q)) : [];
  const hasResults = srSponsors.length||srItems.length||srTx.length;

  const navItems = [
    { id:'dashboard', label:'Dashboard', icon:'dashboard' },
    { id:'sponsors', label:'Sponsors', icon:'sponsors' },
    { id:'items', label:'Items', icon:'items' },
    { id:'transactions', label:'Transactions', icon:'transactions' },
  ];

  function navigate(p) { setPage(p); setSidebarOpen(false); }

  const pageTitle = navItems.find(n=>n.id===page)?.label||'';

  return (
    <div className="app-shell">
      {/* Toast */}
      <div className="toast-wrap">
        {toasts.map(t=><div key={t.id} className={`toast ${t.type}`}>{t.type==='error'?'⚠️':'✓'} {t.msg}</div>)}
      </div>

      {/* Sidebar overlay for mobile */}
      <div className="sidebar-overlay" style={{display:sidebarOpen?'block':'none'}} onClick={()=>setSidebarOpen(false)}/>

      {/* Sidebar */}
      <aside className={`sidebar ${sidebarOpen?'open':''}`}>
        <div className="sidebar-logo">
          <h1>PUP REVO 2026</h1>
          <p>Sponsorship Inventory</p>
        </div>
        <nav className="sidebar-nav">
          {navItems.map(n=>(
            <div key={n.id} className={`nav-item ${page===n.id?'active':''}`} onClick={()=>navigate(n.id)}>
              <span className="nav-icon"><Icon name={n.icon}/></span>{n.label}
            </div>
          ))}
        </nav>
        <div className="sidebar-footer">
          {liveConnected && <div className="live-badge"><span className="live-dot"/>Live</div>}
          <div style={{marginTop:12,fontSize:12,color:'rgba(255,255,255,.4)',overflow:'hidden',textOverflow:'ellipsis',whiteSpace:'nowrap'}}>{user?.email}</div>
          <button className="btn btn-outline btn-sm" style={{marginTop:8,width:'100%',color:'rgba(255,255,255,.6)',border:'1px solid rgba(255,255,255,.15)',background:'transparent',justifyContent:'center'}} onClick={handleLogout}><Icon name="logout" size={14}/>Sign Out</button>
        </div>
      </aside>

      {/* Main */}
      <main className="main">
        <div className="topbar">
          <button className="menu-toggle" onClick={()=>setSidebarOpen(!sidebarOpen)}><Icon name="menu" size={22}/></button>
          <div className="topbar-title">{pageTitle}</div>
          <div className="search-wrap" ref={searchRef}>
            <span className="search-icon"><Icon name="search" size={15}/></span>
            <input className="search-input" placeholder="Search everything…" value={searchQ}
              onChange={e=>{setSearchQ(e.target.value);setShowSearch(true);}}
              onFocus={()=>setShowSearch(true)}/>
            {showSearch && q.length>1 && (
              <div className="search-results">
                {!hasResults && <div style={{padding:'16px',fontSize:13,color:'var(--text3)',textAlign:'center'}}>No results for "{searchQ}"</div>}
                {srSponsors.length>0 && <div className="search-section">
                  <div className="search-section-title">Sponsors</div>
                  {srSponsors.map(s=><div key={s.id} className="search-item" onClick={()=>{navigate('sponsors');setSearchQ('');setShowSearch(false);}}>
                    <span className="search-badge">SP</span>{s.name}{s.company?` — ${s.company}`:''}
                  </div>)}
                </div>}
                {srItems.length>0 && <div className="search-section">
                  <div className="search-section-title">Items</div>
                  {srItems.map(i=><div key={i.id} className="search-item" onClick={()=>{navigate('items');setSearchQ('');setShowSearch(false);}}>
                    <span className="search-badge">IT</span>{i.name}{i.variant?` — ${i.variant}`:''}
                  </div>)}
                </div>}
                {srTx.length>0 && <div className="search-section">
                  <div className="search-section-title">Transactions</div>
                  {srTx.map(t=>{const it=items.find(i=>i.id===t.item_id);return <div key={t.id} className="search-item" onClick={()=>{navigate('transactions');setSearchQ('');setShowSearch(false);}}>
                    <span className="search-badge">TX</span>{t.received_by} · {it?.name||'item'} · {t.qty_received}x
                  </div>;})}
                </div>}
              </div>
            )}
          </div>
        </div>

        {loading ? (
          <div className="page">
            <div className="stat-grid">{[1,2,3,4].map(i=><div key={i} className="skeleton" style={{height:100}}/>)}</div>
            <div className="skeleton" style={{height:300,marginTop:16}}/>
          </div>
        ) : (
          <>
            {page==='dashboard' && <Dashboard sponsors={sponsors} items={items} transactions={transactions} onNav={navigate}/>}
            {page==='sponsors' && <SponsorsPage sponsors={sponsors} items={items} transactions={transactions} onRefresh={fetchAll}/>}
            {page==='items' && <ItemsPage items={items} sponsors={sponsors} onRefresh={fetchAll}/>}
            {page==='transactions' && <TransactionsPage transactions={transactions} sponsors={sponsors} items={items} onRefresh={fetchAll}/>}
          </>
        )}
      </main>
    </div>
  );
}

ReactDOM.createRoot(document.getElementById('root')).render(<App/>);
</script>
</body>
</html>
